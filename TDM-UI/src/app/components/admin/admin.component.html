<app-spinneroverlay *ngIf="isLoading"></app-spinneroverlay>
<div class="admin-container">
  <div class="button-container">
  <button mat-raised-button color="primary" (click)="addUser()" class="marginB20">
    Add New User
  </button>
</div>
  <div class="table-wrapper">
  <mat-table [dataSource]="users">
    
    <ng-container matColumnDef="user_id">
      <mat-header-cell *matHeaderCellDef> User Id </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{ user.user_id }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="username">
      <mat-header-cell *matHeaderCellDef> User Name </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{ user.username }} </mat-cell>
    </ng-container>


    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef> Email </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{ user.email }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
      <mat-cell *matCellDef="let user">
        <!--<mat-checkbox
          [checked]="user.status === 'active'"
          disabled
        ></mat-checkbox>-->
        {{ user.status }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="role">
      <mat-header-cell *matHeaderCellDef> Role </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{ user.role }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="last_modified_by">
      <mat-header-cell *matHeaderCellDef> Last Modified By </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{ user.last_modified_by }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
        <mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="updateUser(user)" aria-label="Update">
            <mat-icon>edit</mat-icon>
          </button>    
          <button mat-icon-button color="warn" (click)="deleteUser(user)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
  </div>
</div>
