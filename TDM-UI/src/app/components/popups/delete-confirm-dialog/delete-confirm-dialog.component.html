<h2 mat-dialog-title class="text-center">Confirm Deletion</h2>
<mat-dialog-content>
  Are you sure you want to delete this row?
</mat-dialog-content>
<mat-dialog-actions class="mLeft">
  <button mat-raised-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onConfirm()">
    Yes, Delete
  </button>
</mat-dialog-actions>
